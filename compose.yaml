services:
  app:
    build: .
    image: lexicona
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/data

  # One-off CLI. Plain up/stop/down leave it alone; arguments replace `command`.
  lexicona-admin:
    build: .
    image: lexicona
    profiles:
      - lexicona-admin
    entrypoint: ["lexicona-admin"]
    command: ["list-users"]
    env_file: .env
    volumes:
      - data:/data
    stdin_open: true
    tty: true
    restart: "no"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      LEXICONA_DOMAIN: ${LEXICONA_DOMAIN:?set LEXICONA_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  data:
  caddy_data:
  caddy_config:
