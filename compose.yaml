services:
  app:
    build: .
    image: lexicona
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/data

  # One-off CLI. Plain up/stop/down leave it alone; arguments replace `command`.
  lexicona-admin:
    build: .
    image: lexicona
    profiles:
      - lexicona-admin
    entrypoint: ["lexicona-admin"]
    command: ["list-users"]
    env_file: .env
    volumes:
      - data:/data
    stdin_open: true
    tty: true
    restart: "no"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${LEXICONA_HTTPS_PORT:-8443}:443"
    environment:
      LEXICONA_DOMAIN: ${LEXICONA_DOMAIN:?set LEXICONA_DOMAIN in .env}
      LEXICONA_TLS_CERT: ${LEXICONA_TLS_CERT:?set LEXICONA_TLS_CERT in .env}
      LEXICONA_TLS_KEY: ${LEXICONA_TLS_KEY:?set LEXICONA_TLS_KEY in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${LEXICONA_TLS_DIR:?set LEXICONA_TLS_DIR in .env}:${LEXICONA_TLS_DIR:?set LEXICONA_TLS_DIR in .env}:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  data:
  caddy_data:
  caddy_config:
